<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modak WB | Police Bharti Study</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#0b3d91,#1769d1);color:white;padding:24px 18px;text-align:center}
.logo{font-size:32px;font-weight:800}.tag{opacity:.9;margin-top:6px}
main{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #00000012}
h2{margin-top:0}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#1769d1;color:#fff}
.subject{background:#eef5ff;color:#0b3d91}.subject.active{background:#1769d1;color:#fff}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.timer{font-size:22px;font-weight:800;color:#d33}
.option{display:block;width:100%;text-align:left;background:#f1f4f8;color:#172033;margin:10px 0}.option:hover{background:#e3ebf7}
.option.correct{background:#c9f7d6;color:#14652b}.option.wrong{background:#ffd0d0;color:#8b1111}
.hidden{display:none}.score{font-size:42px;font-weight:800;text-align:center;color:#1769d1}
.small{color:#687386;font-size:14px}
footer{text-align:center;padding:25px;color:#6b7280}
@media(max-width:600px){.subjects{grid-template-columns:1fr}.logo{font-size:28px}}
</style>
</head>
<body>
<header><div class="logo">MODAK WB</div><div class="tag">Police Bharti Study • MCQ Practice</div></header>
<main>
<section id="home" class="card">
<h2>📚 विषय निवडा</h2>
<p class="small">विषय निवडा आणि Police Bharti MCQ test सुरू करा.</p>
<div class="subjects" id="subjects"></div>
</section>

<section id="quiz" class="card hidden">
<div class="row"><b id="subjectTitle"></b><span class="timer" id="timer">05:00</span></div>
<hr><div id="progress" class="small"></div>
<h2 id="question"></h2><div id="options"></div>
<div class="row"><button id="next">पुढचा प्रश्न →</button><button id="quit" style="background:#666">बंद</button></div>
</section>

<section id="result" class="card hidden">
<h2 style="text-align:center">🎉 Test पूर्ण!</h2>
<div class="score" id="score"></div>
<p id="message" style="text-align:center"></p>
<button onclick="restart()" style="width:100%">पुन्हा Test द्या</button>
</section>
</main>
<footer>© 2026 Modak WB • Police Bharti Practice</footer>

<script>
const bank={
"मराठी":[
["'सूर्य' या शब्दाचा समानार्थी शब्द कोणता?",["रवि","चंद्र","पृथ्वी","आकाश"],0],
["'सुंदर' या शब्दाचा विरुद्धार्थी शब्द?",["छान","कुरूप","गोड","मोठा"],1],
["'घर' या शब्दाचे अनेकवचन काय?",["घरा","घरे","घरांनी","घरी"],1],
["'मी शाळेत जातो.' या वाक्यात क्रियापद कोणते?",["मी","शाळेत","जातो","या"],2]
],
"गणित":[
["25 + 37 = ?",["52","62","72","57"],1],
["200 च्या 15% किती?",["20","25","30","35"],2],
["12 × 8 = ?",["86","96","108","88"],1],
["एका संख्येचा 1/4 = 15 आहे. संख्या किती?",["45","50","60","75"],2]
],
"बुद्धिमत्ता":[
["मालिका पूर्ण करा: 2, 4, 8, 16, ?",["20","24","30","32"],3],
["A, C, E, G, ?",["H","I","J","K"],1],
["जर CAT = DBU, तर DOG = ?",["EPH","EOG","DPH","FPI"],0],
["एक व्यक्ती पूर्वेकडे तोंड करून उभी आहे. उजवीकडे वळल्यावर ती कोणत्या दिशेला पाहील?",["उत्तर","दक्षिण","पूर्व","पश्चिम"],1]
],
"सामान्य ज्ञान":[
["भारताची राजधानी कोणती?",["मुंबई","नवी दिल्ली","पुणे","नागपूर"],1],
["महाराष्ट्राची राजधानी कोणती?",["नाशिक","पुणे","मुंबई","सातारा"],2],
["भारताचा राष्ट्रीय प्राणी कोणता?",["सिंह","वाघ","हत्ती","मोर"],1],
["भारतीय संविधान दिन कोणत्या दिवशी साजरा केला जातो?",["15 ऑगस्ट","26 जानेवारी","26 नोव्हेंबर","2 ऑक्टोबर"],2]
]
};

let subject,questions=[],idx=0,score=0,answered=false,time=300,interval;
const $=id=>document.getElementById(id);

Object.keys(bank).forEach(s=>{
 const b=document.createElement("button"); b.className="subject"; b.textContent=s;
 b.onclick=()=>start(s); $("subjects").appendChild(b);
});

function start(s){
 subject=s; questions=[...bank[s]].sort(()=>Math.random()-.5); idx=0; score=0; time=300;
 $("home").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
 $("subjectTitle").textContent="📖 "+s; clearInterval(interval); interval=setInterval(tick,1000); render();
}
function tick(){time--; $("timer").textContent=`${String(Math.floor(time/60)).padStart(2,"0")}:${String(time%60).padStart(2,"0")}`; if(time<=0) finish();}
function render(){
 answered=false; const q=questions[idx]; $("progress").textContent=`प्रश्न ${idx+1} / ${questions.length}`;
 $("question").textContent=q[0]; $("options").innerHTML="";
 q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.textContent=`${String.fromCharCode(65+i)}. ${o}`;b.onclick=()=>answer(i,b);$("options").appendChild(b)});
 $("next").textContent=idx===questions.length-1?"Result पाहा":"पुढचा प्रश्न →";
}
function answer(i,b){
 if(answered)return; answered=true; const q=questions[idx];
 [...$("options").children].forEach((x,n)=>{if(n===q[2])x.classList.add("correct")});
 if(i===q[2])score++; else b.classList.add("wrong");
}
$("next").onclick=()=>{if(!answered)return alert("आधी उत्तर निवडा."); if(idx<questions.length-1){idx++;render()}else finish()};
$("quit").onclick=()=>{clearInterval(interval);$("quiz").classList.add("hidden");$("home").classList.remove("hidden")};
function finish(){clearInterval(interval);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${score} / ${questions.length}`;$("message").textContent=score===questions.length?"Perfect! 🔥":"छान प्रयत्न! अजून practice करा 💪"}
function restart(){start(subject)}
</script>
</body>
</html>
